<html>
    <head>
        <title>Digital Clock🕐</title>
        <style>
            body {
                /* Light blue background */
                background-color: #ADD8E6; 
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                font-family: 'Courier New', Courier, monospace;
            }

            h1 {
                color: #444;
            }

            #clock {
                /* Yellow text */
                color: #FFFF00; 
                font-size: 5em;
                font-weight: bold;
                /* Added a dark shadow to make the yellow easier to read on light blue */
                text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
                background-color: #333; /* Dark box to make it look like a real digital screen */
                padding: 20px 40px;
                border-radius: 15px;
                border: 5px solid #FFD700;
            }
        </style>
    </head>
    <body onload="time()">
        <h1>Digital Clock🕐</h1>
        <div id="clock"></div>

<script>
function time() {
    var date = new Date();
    var hours = date.getHours();
    var minutes = date.getMinutes();
    var seconds = date.getSeconds();
    var miliseconds = date.getMilliseconds();
    var session = "AM";
    
    if (hours == 0) {
        hours = 12;
    }
    if (hours > 12) {
        hours = hours - 12;
        session = "PM";
    }
    
    // Add leading zeros
    hours = (hours < 10) ? "0" + hours : hours;
    minutes = (minutes < 10) ? "0" + minutes : minutes;
    seconds = (seconds < 10) ? "0" + seconds : seconds;
    
    if (miliseconds < 10) {
        miliseconds = "00" + miliseconds;
    } else if (miliseconds < 100) {
        miliseconds = "0" + miliseconds;
    }

    var currentTime = hours + ":" + minutes + ":" + seconds + ":" + miliseconds + " " + session;
    document.getElementById("clock").innerText = currentTime;

    // Update frequently for smooth milliseconds
    setTimeout(time, 1);
}
</script>
    </body>
</html>
